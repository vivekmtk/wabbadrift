# Expected-drift defaults. `common` applies to every game; each game section adds to it.
# A pair's rules file (data/pairs/<pair>.rules.yaml) is created from `common` + its game, and is
# the file to edit.
#
# Patterns are case-insensitive globs: `*` matches anything (including `/`), `?` one character.
# Everything else, including `[` and `]`, is literal. Paths use `/`.
# INI keys are matched as `Section/Key`.

common:
  generator_outputs:
    # whole mods that tools generate
    mods:
      - "*DynDOLOD*Output*"
      - "*TexGen*Output*"
      - "*LODGen*Output*"
      - "*Nemesis*Output*"
      - "*Pandora*Output*"
      - "*FNIS*Output*"
      - "*PGPatcher*Output*"
      - "*ParallaxGen*Output*"
      - "*Synthesis*Output*"
      - "*BodySlide*Output*"
      - "*Bashed Patch*"
      - "*Smashed Patch*"
      - "*Grass Cache*"
      - "*Script Extender*Output*"
      - "SKSE Output"
      - "F4SE Output"
    # files inside any mod
    files:
      - "*.log"
      - "*.bak"
    plugins:
      - "Bashed Patch*.esp"
      - "Smashed Patch*.esp"
      - "Synthesis*.esp"
      - "DynDOLOD.esm"
      - "DynDOLOD.esp"
      - "Occlusion.esp"
    # files in the game root
    game_root:
      - "*.log"
      - "Logs/*"
    overwrite: true
  game_version_files:
    mods: []
    files: []
    # script-extender plugin DLLs; expected only when the two game versions differ
    # (a game executable in the game root changed)
    plugin_dlls: []
    game_root:
      - "installscript.vdf"
      - "steam_api*.dll"
      - "bink2w*.dll"
  machine_specific_ini:
    keys:
      - "*/iSize W"
      - "*/iSize H"
      - "*/iAdapter"
      - "*/bFull Screen"
      - "*/bBorderless"
      - "*/iLocation X"
      - "*/iLocation Y"
      - "*/*Monitor*"
      - "*/Resolution*"
      - "*/iScreenShotIndex"
      - "Launcher/*"
    # a key whose baseline and custom values are both absolute paths
    absolute_paths: true
  intentional_additions:
    # mods under separators matching these are listed as intentional additions, not drift
    separators:
      - "[Custom]*"
  # extra entries for the leak scan (same format as defaults/known_tools.yaml)
  known_tools: []

games:
  skyrimse:
    game_version_files:
      mods: ["*Script Extender*"]
      files: ["SKSE/Plugins/version*-*.bin", "SKSE/Plugins/version*-*.csv"]
      plugin_dlls: ["SKSE/Plugins/*.dll", "SKSE/Plugins/*.pdb"]
      game_root:
        - "SkyrimSE.exe"
        - "SkyrimSELauncher.exe"
        - "skse64_*"
        - "src/*"
        - "Data/Skyrim.esm"
        - "Data/Update.esm"
        - "Data/Dawnguard.esm"
        - "Data/HearthFires.esm"
        - "Data/Dragonborn.esm"
        - "Data/_ResourcePack.*"
        - "Data/cc*"
        - "Skyrim.ccc"
        - "SkyrimReservedAddOnIndexes.txt"
        - "Creations/*"
        # Creation Kit
        - "CreationKit*"
        - "Data/Source/*"
        - "Data/DialogueViews/*"
        - "Data/Scripts/Source/*"
        - "Papyrus Compiler/*"
        - "Tools/*"
        - "lex/*"
